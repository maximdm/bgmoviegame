name: CI

# Run on every PR and on pushes to main so a broken dependency tree (e.g. a
# stale/partial package-lock.json) is caught here instead of failing on Vercel.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 8 needs Node >= 20.19 / 22.12; 22 is the current LTS.
          node-version: 22
          cache: npm

      # `npm ci` installs strictly from package-lock.json and fails if it is out
      # of sync with package.json — this is the gate that catches a broken lockfile.
      - name: Install dependencies
        run: npm ci

      # Engine unit tests (shared/ workspace).
      - name: Run unit tests
        run: npm test

      # The exact command Vercel runs for the static client build.
      - name: Build client
        run: npm run build -w client
